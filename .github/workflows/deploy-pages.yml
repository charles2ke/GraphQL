name: Deploy website to GitHub Pages

on:
  # Deploy on every push to main (no path filter) so the published site is always
  # the built website, even after commits that only touch the backend or docs.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages and switches the source to GitHub Actions so the built
          # website is published instead of the Jekyll-rendered README.
          enablement: true

      - name: Ensure Pages build type is GitHub Actions
        # When Pages was previously configured with the "Deploy from a branch"
        # source, GitHub keeps running the legacy Jekyll build, which republishes
        # the README over this workflow's deployment. Force the build type back to
        # "workflow" so only the built website is served.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow \
            || echo "Could not update the Pages build type; set Settings > Pages > Source to 'GitHub Actions' manually."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        env:
          GITHUB_PAGES: true
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
